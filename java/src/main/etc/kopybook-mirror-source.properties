# Example: copy a topic of raw EBCDIC records and decode it with the kopybook SMT.
name=kopybook-customers
connector.class=org.apache.kafka.connect.mirror.MirrorSourceConnector
source.cluster.alias=raw
source.cluster.bootstrap.servers=localhost:9092
target.cluster.bootstrap.servers=localhost:9092
topics=mainframe.customers.raw
key.converter=org.apache.kafka.connect.converters.ByteArrayConverter
value.converter=io.confluent.connect.avro.AvroConverter
value.converter.schema.registry.url=http://localhost:8081
transforms=cobol
transforms.cobol.type=dev.kopybook.connect.CopybookDecode$Value
transforms.cobol.copybook.path=/etc/kopybook/customer.cpy
transforms.cobol.copybook.include.path=/etc/kopybook/copylib
transforms.cobol.codepage=cp037
