[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kopybook"
version = "0.1.0"
description = "COBOL copybook to Kafka: Avro/JSON Schema, EBCDIC decoding, schema-evolution checks"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "fastavro", "jsonschema"]

[project.scripts]
kopybook = "kopybook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
